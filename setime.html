<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1 style="text-align: center; font-size: 100px;">Tips onTouch Typing </h1>

    <div class="time1"></div>
    <div class="time2"></div>
    <div class="time3"></div>
    <script>
    var time1 = document.querySelector(".time1");
    var time2 = document.querySelector(".time2");
    var time3 = document.querySelector(".time3");

   
setTimeout(()=>{
    time1.innerText= "Touch Typing is Awesome👍";
    time1.style.fontSize ='40px';
    time1.style.color ='red';
    }, 3000);
setTimeout(()=>{
    time2.innerText= "Touch Typing is Awesome👍";
    time2.style.fontSize ='50px';
    time2.style.color ='red';
    }, 4000);
setTimeout(()=>{
    time3.innerText= "Touch Typing is Awesome👍";
    time3.style.fontSize ='60px';
    time3.style.color ='red';
    }, 5000);
    </script>
</body>
</html>
